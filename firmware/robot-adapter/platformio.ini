; Pomo CoreS3 robot display adapter. Renders backend display state received as
; JSON lines over USB serial (see ../../docs/protocol.md, "Robot display serial").

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified
