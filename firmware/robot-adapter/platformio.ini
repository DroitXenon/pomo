; Pomo CoreS3 robot display adapter. Renders backend display state received as
; JSON lines over USB serial (see ../../docs/protocol.md, "Robot display serial").

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
; Serial uses the TinyUSB CDC driver (USB_MODE=0). The default hardware
; USB-Serial-JTAG driver in Arduino-ESP32 2.0.x drops bytes at camera data rates.
; Uploads reset the board with a 1200-baud touch; tools/after_upload.py then
; restarts it into the new firmware. If an upload cannot find the board, hold
; the CoreS3 reset button for about 3 s (green LED) and upload again.
; The board defaults, with ARDUINO_USB_MODE changed from 1 to 0.
board_build.extra_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -DCORE_DEBUG_LEVEL=0
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
extra_scripts = post:tools/after_upload.py
lib_deps =
    m5stack/M5Unified
